<style>
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --ink:#13263A; --muted:#5B6B7B; --line:#C9D3DB;
  --accent:#0E5C66; --accent-soft:#DCEDEE; --mark:#FFE07A; --mark-ink:#13263A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A24; --surface:#172633; --ink:#E6EDF2; --muted:#93A4B3; --line:#2C3F50;
    --accent:#5FC4CF; --accent-soft:#1B3A42; --mark:#8A6D12; --mark-ink:#FFF4CC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A24; --surface:#172633; --ink:#E6EDF2; --muted:#93A4B3; --line:#2C3F50;
  --accent:#5FC4CF; --accent-soft:#1B3A42; --mark:#8A6D12; --mark-ink:#FFF4CC;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:17px; line-height:1.45}
main{min-height:100vh; min-height:100dvh; display:grid; grid-template-rows:1fr auto 1fr; padding:0 20px}
.top{align-self:end; text-align:center; padding-bottom:22px}
h1{font-size:1.9rem; line-height:1.15; margin:0 0 .35rem; font-weight:700; letter-spacing:-.01em}
.top p{margin:0; color:var(--muted)}
.field{position:relative; width:100%; max-width:640px; justify-self:center}
.input-wrap{display:flex; align-items:center; gap:12px; background:var(--surface);
  border:2px solid var(--line); border-radius:14px; padding:0 18px; transition:border-color .15s}
.input-wrap:focus-within{border-color:var(--accent)}
.field.open .input-wrap{border-bottom-left-radius:0; border-bottom-right-radius:0}
.input-wrap svg{flex:none; color:var(--muted)}
input{flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink);
  font:inherit; font-size:1.25rem; padding:18px 0}
input::placeholder{color:var(--muted); opacity:.8}
.clear{border:0; background:none; color:var(--muted); font:inherit; font-size:1.4rem; cursor:pointer;
  padding:4px 6px; border-radius:6px; line-height:1}
.clear:focus-visible{outline:2px solid var(--accent)}
ul{list-style:none; margin:0; padding:6px 0; position:absolute; left:0; right:0; top:100%; z-index:5;
  background:var(--surface); border:2px solid var(--accent); border-top:1px solid var(--line);
  border-radius:0 0 14px 14px; max-height:min(420px,52vh); overflow-y:auto;
  box-shadow:0 18px 30px -18px rgba(10,30,45,.45)}
li{display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:10px 18px; cursor:pointer}
li[aria-selected="true"]{background:var(--accent-soft)}
li .name{font-weight:700}
li .via{display:block; font-size:.88rem; color:var(--muted); margin-top:1px}
li .code{flex:none; font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums}
li.empty{display:block; cursor:default; color:var(--muted)}
mark{background:var(--mark); color:var(--mark-ink); border-radius:3px; padding:0 1px}
.bottom{align-self:start; width:100%; max-width:640px; justify-self:center; padding:28px 0 32px}
.card{background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--accent);
  border-radius:10px; padding:18px 20px}
.card h2{margin:0; font-size:1.35rem}
.card .meta{color:var(--muted); margin:.2rem 0 .9rem; font-size:.95rem}
.card h3{font-size:.95rem; margin:0 0 .45rem; color:var(--muted); font-weight:400}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); border-radius:999px; padding:3px 11px; font-size:.92rem}
.chip small{color:var(--muted)}
button.chip{font:inherit; font-size:.92rem; color:var(--ink); background:transparent; cursor:pointer}
button.chip:hover{border-color:var(--accent); color:var(--accent)}
button.chip:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.card h3+.chips{margin-bottom:1rem}
.card .chips:last-child{margin-bottom:0}
li.group .name::after{content:""; display:inline-block; width:.55em; height:.55em; margin-left:.45em; border-radius:2px; background:var(--accent); vertical-align:.12em}
footer{color:var(--muted); font-size:.85rem; text-align:center; margin-top:22px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
@media (max-width:520px){ h1{font-size:1.5rem} input{font-size:1.1rem; padding:15px 0} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Auslösende Substanz suchen</h1>
    <p>Wirkstoff, Handelsname, Lebensmittel, Pollen oder Tier</p>
  </div>

  <div class="field" id="field">
    <label for="q" class="sr">Substanz suchen</label>
    <div class="input-wrap">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
      <input id="q" type="text" autocomplete="off" spellcheck="false" placeholder="z. B. Garnele, Novalgin, Antibiotika"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="list">
      <button class="clear" id="clear" type="button" aria-label="Eingabe löschen" hidden>×</button>
    </div>
    <ul id="list" role="listbox" hidden></ul>
  </div>

  <div class="bottom">
    <div id="detail" aria-live="polite"></div>
    <footer id="stand"></footer>
  </div>
</main>

<script>
/* ---------- Daten ---------- */
const T = JSON.parse(document.getElementById("terminologie").textContent);
const TYP = T.typen;
const K = Object.entries(T.konzepte).map(([code,k]) => ({code, de:k.de, en:k.en||"", syn:k.syn||[]}));
const G = Object.entries(T.gruppen||{}).map(([id,g]) => ({id, name:g.name, info:g.info||"", syn:g.syn||[], raw:g.enthaelt||[]}));
const kByCode = new Map(K.map((k,i)=>[k.code,i])), gById = new Map(G.map((g,i)=>[g.id,i]));
const byDe = (a,b)=>K[a].de.localeCompare(K[b].de,"de");

// Sammelbegriffe rekursiv auflösen (mit Zyklenschutz), Rückverweis Konzept -> Gruppen
function resolve(gi, seen=new Set()){
  if (seen.has(gi)) return []; seen.add(gi);
  const out = new Set();
  for (const m of G[gi].raw){
    if (m[0]==="@"){ const j=gById.get(m.slice(1)); if (j!==undefined) resolve(j,seen).forEach(x=>out.add(x)); }
    else { const i=kByCode.get(m); if (i!==undefined) out.add(i); }
  }
  return [...out];
}
G.forEach((g,i)=>{ g.members = resolve(i).sort(byDe); g.sub = g.raw.filter(m=>m[0]==="@").map(m=>gById.get(m.slice(1))).filter(x=>x!==undefined); });
const parentsOf = K.map(()=>[]);
G.forEach((g,gi)=>g.raw.forEach(m=>{ if (m[0]!=="@" && kByCode.has(m)) parentsOf[kByCode.get(m)].push(gi); }));

/* ---------- Normalisierung ---------- */
const WORDCH = /[0-9A-Za-zÀ-ÖØ-öø-ÿß]/;
function normChar(ch){
  const l=ch.toLowerCase();
  if (l==="ä") return "ae"; if (l==="ö") return "oe"; if (l==="ü") return "ue"; if (l==="ß") return "ss";
  const b=l.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return /[a-z0-9]/.test(b) ? b : "";
}
function compactMap(s){ let out="",map=[]; for (let i=0;i<s.length;i++) for (const c of normChar(s[i])){ out+=c; map.push(i); } return {out,map}; }
const compact = s => compactMap(s).out;
const rawWords = s => s.split(/[^0-9A-Za-zÀ-ÖØ-öø-ÿß]+/).filter(Boolean);
// Kölner Phonetik: gleich klingende Schreibweisen (c/k/z, ph/f, dt/t …) erhalten denselben Code
function koeln(word){
  const s=word.toUpperCase().replace(/Ä/g,"A").replace(/Ö/g,"O").replace(/Ü/g,"U").replace(/ß/g,"S").normalize("NFD").replace(/[^A-Z]/g,"");
  let code="";
  for (let i=0;i<s.length;i++){
    const c=s[i], p=s[i-1]||"", n=s[i+1]||"", nIn=set=>n!==""&&set.includes(n);
    switch(c){
      case "A":case "E":case "I":case "J":case "O":case "U":case "Y": code+="0"; break;
      case "H": break;
      case "B": code+="1"; break;
      case "P": code+= n==="H"?"3":"1"; break;
      case "D":case "T": code+= nIn("CSZ")?"8":"2"; break;
      case "F":case "V":case "W": code+="3"; break;
      case "G":case "K":case "Q": code+="4"; break;
      case "C": code+= i===0 ? (nIn("AHKLOQRUX")?"4":"8") : (nIn("AHKOQUX") && !"SZ".includes(p||"-") ? "4":"8"); break;
      case "X": code+= (p!==""&&"CKQ".includes(p))?"8":"48"; break;
      case "L": code+="5"; break;
      case "M":case "N": code+="6"; break;
      case "R": code+="7"; break;
      case "S":case "Z": code+="8"; break;
    }
  }
  let o=""; for (const ch of code) if (ch!==o[o.length-1]) o+=ch;
  return o ? o[0]+o.slice(1).replace(/0/g,"") : "";
}
function lev(a,b,max){
  if (Math.abs(a.length-b.length)>max) return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for (let i=1;i<=a.length;i++){
    const cur=[i]; let best=i;
    for (let j=1;j<=b.length;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); if (cur[j]<best) best=cur[j]; }
    if (best>max) return max+1; prev=cur;
  }
  return prev[b.length];
}
const trigrams = s => { const t=new Set(); for (let i=0;i+3<=s.length;i++) t.add(s.slice(i,i+3)); return t; };

/* ---------- Suchindex (einmalig beim Laden) ---------- */
// TERMS: ein Eintrag je Suchbegriff. o = Index in K bzw. G, g = true bei Sammelbegriff
const TERMS=[], PRE=new Map(), TRI=new Map(), PHO=new Map();
const put=(m,k,i)=>{ let a=m.get(k); if (!a) m.set(k,a=[]); if (a[a.length-1]!==i) a.push(i); };
function addTerm(o,g,text,type,hint){
  const i=TERMS.length, c=compact(text), rw=rawWords(text), w=rw.map(compact).filter(Boolean), p=rw.map(koeln).filter(x=>x.length>=2);
  TERMS.push({o,g,text,type,hint,c,w,p,wt:(TYP[type]||{gewicht:.9}).gewicht});
  if (c.length>=2) put(PRE,c.slice(0,2),i);
  for (const x of w) if (x.length>=2) put(PRE,x.slice(0,2),i);
  for (const t of trigrams(c)) put(TRI,t,i);
  for (const x of p) put(PHO,x.slice(0,2),i);
}
K.forEach((k,i)=>{ addTerm(i,false,k.de,"K"); k.syn.forEach(([t,ty,h])=>addTerm(i,false,t,ty,h)); if (k.en && compact(k.en)!==compact(k.de)) addTerm(i,false,k.en,"E"); });
G.forEach((g,i)=>{ addTerm(i,true,g.name,"G"); g.syn.forEach(([t,ty,h])=>addTerm(i,true,t,ty,h)); });

/* ---------- Suche ---------- */
const MAX=8, STRONG=60, cache=new Map();
function score(t,qc,qw,qp){
  if (t.c===qc) return 100;
  if (t.type==="A" && t.c.length<=3) return 0;            // kurze Abkürzungen nur exakt
  if (t.c.startsWith(qc)) return 90;
  if (qw.length>1 && qw.every(q=>t.w.some(w=>w.startsWith(q)))) return 82;
  if (t.w.some(w=>w.startsWith(qc))) return 80;
  if (qc.length>=4 && t.c.includes(qc)) return 62;
  if (qc.length>=4 && qp.length>=3 && t.p.some(x=>x.startsWith(qp))){   // klingt gleich
    let d=3; for (const w of t.w) d=Math.min(d,lev(qc,w.slice(0,qc.length),3));
    return 56-4*d;
  }
  if (qc.length>=5){                                        // Tippfehler
    const tol=qc.length>=7?2:1;
    for (const w of t.w) for (const len of [qc.length-1,qc.length,qc.length+1]){
      if (len<4||len>w.length) continue;
      const d=lev(qc,w.slice(0,len),tol); if (d<=tol) return 45-5*d;
    }
  }
  return 0;
}
function search(q){
  const qc=compact(q); if (qc.length<2) return [];
  if (cache.has(qc+"|"+q.trim().toLowerCase())) return cache.get(qc+"|"+q.trim().toLowerCase());
  const rw=rawWords(q), qw=rw.map(compact).filter(Boolean), qp=koeln(rw.join(""));
  // 1. Kandidaten über Indizes – nur diese werden bewertet
  const cand=new Set(), add=a=>{ if (a) for (const i of a) cand.add(i); };
  add(PRE.get(qc.slice(0,2))); for (const w of qw) add(PRE.get(w.slice(0,2)));
  if (qc.length>=4){
    const tg=trigrams(qc), need=Math.max(1,Math.ceil(tg.size/3)), cnt=new Map();
    for (const g of tg){ const a=TRI.get(g); if (a) for (const i of a) cnt.set(i,(cnt.get(i)||0)+1); }
    for (const [i,n] of cnt) if (n>=need) cand.add(i);
    if (qp.length>=3) add(PHO.get(qp.slice(0,2)));
  }
  // 2. Bewerten, je Konzept/Sammelbegriff bester Treffer
  const best=new Map();
  for (const i of cand){
    const t=TERMS[i], raw=score(t,qc,qw,qp); if (!raw) continue;
    const s=raw*t.wt, key=(t.g?"g":"k")+t.o, cur=best.get(key);
    if (!cur || s>cur.s || (s===cur.s && (t.type==="K"||t.type==="G"))) best.set(key,{s,raw,t});
  }
  let res=[...best.values()];
  if (res.some(r=>r.raw>=STRONG)) res=res.filter(r=>r.raw>=STRONG);   // Klang-/Tippfehler-Treffer nur als Rückfall
  const nm=r=>r.t.g?G[r.t.o].name:K[r.t.o].de;
  res.sort((a,b)=>b.s-a.s || nm(a).length-nm(b).length || nm(a).localeCompare(nm(b),"de"));
  res=res.slice(0,MAX);
  if (cache.size>300) cache.clear();
  cache.set(qc+"|"+q.trim().toLowerCase(),res);
  return res;
}

/* ---------- Anzeige ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function highlight(text,q){
  const qc=compact(q); if (!qc) return esc(text);
  const {out,map}=compactMap(text); let idx=-1;
  for (let k=out.indexOf(qc); k!==-1; k=out.indexOf(qc,k+1)){
    const oi=map[k]; if (oi===0 || !WORDCH.test(text[oi-1])){ idx=k; break; } if (idx===-1) idx=k;
  }
  if (idx===-1) return esc(text);
  const a=map[idx], b=map[idx+qc.length-1]+1;
  return esc(text.slice(0,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"+esc(text.slice(b));
}
const typLabel = ty => (TYP[ty]||{}).label || "";

const field=document.getElementById("field"), input=document.getElementById("q"), list=document.getElementById("list"),
      clearBtn=document.getElementById("clear"), detail=document.getElementById("detail");
let results=[], active=-1;

function render(){
  const q=input.value; clearBtn.hidden=!q;
  if (compact(q).length<2){ close(); return; }
  results=search(q); active=results.length?0:-1;
  list.innerHTML = results.length ? results.map((r,i)=>{
    const t=r.t, own=t.type==="K"||t.type==="G";
    const name = t.g ? G[t.o].name : K[t.o].de;
    const via = own ? "" : `<span class="via">gefunden über ${highlight(t.text,q)} (${esc(typLabel(t.type))})</span>`;
    const right = t.g ? `${G[t.o].members.length} Substanzen` : K[t.o].code;
    return `<li role="option" id="opt${i}" data-i="${i}" class="${t.g?"group":""}" aria-selected="${i===active}"><span><span class="name">${own?highlight(name,q):esc(name)}</span>${via}</span><span class="code">${right}</span></li>`;
  }).join("") : '<li class="empty">Keine Substanz gefunden. Prüfen Sie die Schreibweise oder suchen Sie nach Wirkstoff, Handelsname oder Sammelbegriff.</li>';
  list.hidden=false; field.classList.add("open"); input.setAttribute("aria-expanded","true");
  input.setAttribute("aria-activedescendant", active>=0?"opt"+active:"");
}
function close(){ list.hidden=true; list.innerHTML=""; results=[]; active=-1; field.classList.remove("open"); input.setAttribute("aria-expanded","false"); input.removeAttribute("aria-activedescendant"); }
function setActive(i){
  if (!results.length) return; active=(i+results.length)%results.length;
  [...list.children].forEach((li,k)=>li.setAttribute("aria-selected",k===active));
  list.children[active].scrollIntoView({block:"nearest"}); input.setAttribute("aria-activedescendant","opt"+active);
}
const chipK = i => `<button type="button" class="chip" data-k="${i}">${esc(K[i].de)}</button>`;
const chipG = i => `<button type="button" class="chip" data-g="${i}">${esc(G[i].name)}</button>`;
const synChips = syn => syn.map(([t,ty])=>`<span class="chip">${esc(t)} <small>${esc(typLabel(ty))}</small></span>`).join("");
function showConcept(i){
  const k=K[i]; input.value=k.de; clearBtn.hidden=false; close();
  const groups=parentsOf[i];
  detail.innerHTML=`<div class="card"><h2>${esc(k.de)}</h2><p class="meta">SNOMED CT ${k.code}${k.en?", "+esc(k.en):""}</p>
    <h3>Synonyme und Schreibweisen</h3><div class="chips">${synChips(k.syn)||"—"}</div>
    ${groups.length?`<h3>Gehört zu</h3><div class="chips">${groups.map(chipG).join("")}</div>`:""}</div>`;
}
function showGroup(i){
  const g=G[i]; input.value=g.name; clearBtn.hidden=false; close();
  detail.innerHTML=`<div class="card"><h2>${esc(g.name)}</h2><p class="meta">Sammelbegriff mit ${g.members.length} Substanzen${g.info?", "+esc(g.info):""}</p>
    ${g.sub.length?`<h3>Enthält Untergruppen</h3><div class="chips">${g.sub.map(chipG).join("")}</div>`:""}
    <h3>Substanz auswählen</h3><div class="chips">${g.members.map(chipK).join("")}</div>
    ${g.syn.length?`<h3>Suchbegriffe</h3><div class="chips">${synChips(g.syn)}</div>`:""}</div>`;
}
function choose(i){ const t=results[i].t; t.g ? showGroup(t.o) : showConcept(t.o); }

input.addEventListener("input",()=>{ detail.innerHTML=""; render(); });
input.addEventListener("focus",()=>{ if (!detail.innerHTML) render(); });
input.addEventListener("keydown",e=>{
  if (list.hidden){ if (e.key==="ArrowDown"){ render(); e.preventDefault(); } return; }
  if (e.key==="ArrowDown"){ setActive(active+1); e.preventDefault(); }
  else if (e.key==="ArrowUp"){ setActive(active-1); e.preventDefault(); }
  else if (e.key==="Enter" && active>=0){ choose(active); e.preventDefault(); }
  else if (e.key==="Escape") close();
});
list.addEventListener("mousedown",e=>{ const li=e.target.closest("li[data-i]"); if (li){ e.preventDefault(); choose(+li.dataset.i); } });
detail.addEventListener("click",e=>{ const b=e.target.closest("button.chip"); if (!b) return;
  if (b.dataset.k) showConcept(+b.dataset.k); else showGroup(+b.dataset.g); input.focus(); });
document.addEventListener("click",e=>{ if (!field.contains(e.target)) close(); });
clearBtn.addEventListener("click",()=>{ input.value=""; detail.innerHTML=""; close(); clearBtn.hidden=true; input.focus(); });
document.getElementById("stand").textContent =
  `Grundlage: ${T.meta.quelle}. ${K.length} Substanzen, ${K.reduce((n,k)=>n+k.syn.length,0)} Synonyme, ${G.length} Sammelbegriffe, Stand ${new Date(T.meta.stand).toLocaleDateString("de-DE")}. Synonyme KI-gestützt erstellt.`;
input.focus();
</script>
</body>
</html>
